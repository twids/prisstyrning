name: prisstyrning

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisstyrning
      POSTGRES_USER: prisstyrning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside Git}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisstyrning -d prisstyrning"]
      interval: 5s
      timeout: 5s
      retries: 10

  emhass:
    # Official multi-arch release v0.18.0, index digest verified 2026-08-26.
    image: ghcr.io/davidusb-geek/emhass:v0.18.0@sha256:b9c88442c2623c83469cb6ae103991a349cc63fbd5c8fd100d5e071e6ff41204
    restart: unless-stopped
    environment:
      TZ: Europe/Stockholm
      DATA_PATH: /data
      CONFIG_PATH: /share/config.json
      SECRETS_PATH: /app/secrets_emhass.yaml
      LOGGING_LEVEL: INFO
    volumes:
      - ./emhass/share:/share
      - ./emhass/secrets_emhass.stateless.yaml:/app/secrets_emhass.yaml:ro
      - emhass-data:/data
    expose:
      - "5000"
    networks:
      - thermal-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/get-config', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  prisstyrning:
    image: ghcr.io/your-org/prisstyrning:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRISSTYRNING_ConnectionStrings__DefaultConnection: Host=postgres;Database=prisstyrning;Username=prisstyrning;Password=${POSTGRES_PASSWORD}
      PRISSTYRNING_Emhass__Enabled: ${EMHASS_ENABLED:-false}
      PRISSTYRNING_Emhass__BaseUrl: http://emhass:5000
      PRISSTYRNING_Emhass__ResultPath: /emhass-data/opt_res_latest.csv
      PRISSTYRNING_Emhass__SolverTimeoutSeconds: "45"
      PRISSTYRNING_Emhass__OptimizationTimeStepMinutes: "15"
      PRISSTYRNING_Emhass__HorizonHours: "48"
      # Behåll samma ONECTA-/Nord Pool-/legacyvärden som den nuvarande installationen.
      # ApplySchedule ska inte ändras bara för att shadowtelemetri läggs till.
      PRISSTYRNING_Daikin__ApplySchedule: ${DAIKIN_APPLY_SCHEDULE:-false}
      PRISSTYRNING_Security__DataProtectionKeysPath: /data/data-protection-keys
      PRISSTYRNING_Security__CredentialEncryption__KeyFile: /run/secrets/credential_encryption_key
      # Behåll true under canary så föregående image fortfarande kan läsa Daikin-token vid rollback.
      PRISSTYRNING_Security__CredentialEncryption__PreserveLegacyDaikinTokenColumns: ${PRESERVE_LEGACY_DAIKIN_TOKEN_COLUMNS:-true}
      PRISSTYRNING_Thermal__EnableDhwWriterCoordination: "false"
      PRISSTYRNING_Thermal__AllowLwtActive: "false"
      PRISSTYRNING_Thermal__AllowFullActive: "false"
      PRISSTYRNING_PORT: "5000"
    secrets:
      - credential_encryption_key
    volumes:
      - emhass-data:/emhass-data:ro
      - ./data:/data
    expose:
      - "5000"
    networks:
      - backend
      - thermal-internal

secrets:
  credential_encryption_key:
    file: ${CREDENTIAL_ENCRYPTION_KEY_FILE:-./secrets/credential_encryption_key}

volumes:
  pgdata:
  emhass-data:

networks:
  backend:
  thermal-internal:
    internal: true

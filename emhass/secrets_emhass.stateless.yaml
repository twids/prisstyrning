# EMHASS requires these fields during initialization, but prisstyrning passes every
# forecast at runtime and never asks EMHASS to read or publish Home Assistant data.
# This deliberately contains no valid Home Assistant address or token.
hass_url: http://home-assistant.invalid/
# The literal sentinel 'empty' makes get_ha_config skip HA (without SUPERVISOR_TOKEN).
# A non-empty dummy token incorrectly triggers an HA request and aborts optimization.
long_lived_token: empty
time_zone: Europe/Stockholm
lat: 0
lon: 0
alt: 0
